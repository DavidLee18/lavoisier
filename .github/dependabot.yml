# Dependabot scope for this repo.
#
# Cargo is deliberately absent. Lavoisier was a Rust workspace through v0.15.0; `main` is Haskell and
# carries no Cargo manifest, so cargo updates have nothing to act on — one such run failed here after
# the swap (`cargo in / for quinn-proto`). The retired Rust tree lives on the `rust` branch, which
# Dependabot does not scan: it only ever looks at the default branch.
#
# Haskell/Cabal is not a supported ecosystem, so dependency bumps for the package itself stay manual.
#
# GitHub Actions is supported and worth having: CLAUDE.md requires every action to be pinned to a
# full commit SHA with the version in a trailing comment, and Dependabot updates both together —
# which is exactly the maintenance that otherwise rots (CI currently warns about actions still on
# Node 20).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
