name: release

# Release/packaging. Tag `v*` (e.g. `git tag v0.16.0 && git push origin v0.16.0`)
# → build the `lav` binary for the common targets, bundle its non-system shared libraries into a
# self-contained tarball (lavoisier-<target>.tar.gz, files at the archive root), and attach them to
# the GitHub release. Tags v0.7.1..v0.15.0 on this line are the retired Rust implementation and
# hs-v0.13.0..hs-v0.15.0 the Haskell port before it became canonical; v0.16.0 onwards is this
# pipeline. `workflow_dispatch` builds and packages without uploading, for validation.
#
# `lav` links libtree-sitter and libsnappy dynamically, so scripts/package-haskell.sh carries those
# beside the binary and rewrites its load paths — the tarball is self-contained regardless.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    env:
      GHC_VERSION: "9.10.3"
      CABAL_VERSION: "3.16.1.0"
      TREE_SITTER_VERSION: "0.26.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # proto-lens-protobuf-types (via the xai-proto codec) runs protoc at build time — same pinned
      # download (no Node action, SHA-256 verified).
      - name: Install protoc
        shell: bash
        env:
          PROTOC_VERSION: "29.3"
        run: |
          set -euo pipefail
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   asset=linux-x86_64;   sha=3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a ;;
            Linux-ARM64) asset=linux-aarch_64; sha=6427349140e01f06e049e707a58709a4f221ae73ab9a0425bc4a00c8d0e1ab32 ;;
            macOS-ARM64) asset=osx-aarch_64;   sha=2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765 ;;
            *) echo "unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${asset}.zip"
          curl -fsSL -o protoc.zip "$url"
          echo "${sha}  protoc.zip" | shasum -a 256 -c -
          unzip -q protoc.zip -d "$HOME/.protoc"
          echo "$HOME/.protoc/bin" >> "$GITHUB_PATH"
          "$HOME/.protoc/bin/protoc" --version

      # Provision libtree-sitter (ABI 15 → needs >= 0.25) and libsnappy, and write the per-OS
      # cabal.project.dist.local so snappy-c's C-library detection finds libsnappy.
      - name: Native libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          brew install tree-sitter snappy
          B="$(brew --prefix)"
          printf 'package snappy-c\n  extra-lib-dirs: %s/lib\n  extra-include-dirs: %s/include\n' "$B" "$B" > cabal.project.dist.local

      - name: Native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsnappy-dev pkg-config build-essential patchelf
          curl -fsSL -o ts.tar.gz "https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v${TREE_SITTER_VERSION}.tar.gz"
          tar xzf ts.tar.gz
          make -C "tree-sitter-${TREE_SITTER_VERSION}" -j"$(nproc)"
          sudo make -C "tree-sitter-${TREE_SITTER_VERSION}" install PREFIX=/usr/local
          sudo ldconfig
          MA="$(gcc -print-multiarch)"
          printf 'package snappy-c\n  extra-lib-dirs: /usr/lib/%s\n  extra-include-dirs: /usr/include\n' "$MA" > cabal.project.dist.local

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      - name: Build
        run: cabal build --project-file=cabal.project.dist exe:lav

      - name: Package (bundle non-system shared libraries)
        run: |
          set -euo pipefail
          # list-bin must use the same project/flags as the build so it reports the built path.
          BIN="$(cabal list-bin --project-file=cabal.project.dist exe:lav)"
          if [ ! -f "$BIN" ]; then
            BIN="$(find dist-newstyle -type f -path '*x/lav/build/lav/lav' | head -1)"
          fi
          echo "binary: $BIN"
          scripts/package-haskell.sh "$BIN" pkg
          tar czf "lavoisier-${{ matrix.target }}.tar.gz" -C pkg .
          ls -la "lavoisier-${{ matrix.target }}.tar.gz"

      - name: Upload build artifact (the publish job's input; also lets a dispatch run be inspected)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lavoisier-${{ matrix.target }}
          path: lavoisier-${{ matrix.target }}.tar.gz

  # The release is published ONCE, here, with every asset at the same time.
  #
  # It must not be done per-target. This repo has GitHub's *immutable releases* enabled: the first
  # job to attach an asset also publishes the release, and every later upload is then refused with
  # "Cannot upload asset ... to an immutable release". Worse, the tag name is burned permanently —
  # deleting the half-finished release does not free it, so a botched release costs a version number
  # (v0.16.0 was lost exactly this way). One publish step, all files, no race.
  publish:
    name: publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Collect every target's tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: lavoisier-*
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - name: Publish the GitHub release with all assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
          # Immutable releases mean the notes cannot be fixed after the fact either, so the body
          # is generated here rather than written by hand at tag time. MIGRATING.md is linked at
          # *this tag*, so the link always resolves to the version being released.
          generate_release_notes: true
          body: |
            Prebuilt binaries for `aarch64-apple-darwin`, `x86_64-unknown-linux-gnu` and
            `aarch64-unknown-linux-gnu`. Each tarball carries its own dynamic libraries; unpack
            and run `./lav`.

            Upgrading: [`MIGRATING.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/MIGRATING.md)
            for this tag lists every breaking change and the edit it needs.
