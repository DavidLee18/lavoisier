name: codeql

# Advanced (workflow-based) CodeQL setup.
#
# ⚠️ CodeQL CANNOT ANALYSE HASKELL. It has no Haskell extractor, and Haskell is ~75 of this repo's
# source files — the whole program. Nothing below looks at `src/`, `app/`, or `test/`. Read this
# workflow as supply-chain and FFI-boundary cover, NOT as coverage of Lavoisier itself; `-Wall
# -Werror`, the tasty suite, and the budget ceilings remain the only gates on the Haskell.
#
# Two languages are analysed, and the other two GitHub's starter template proposed are deliberately
# dropped:
#   actions  — the workflows themselves. Worth real attention: `release.yml` holds `contents: write`
#              and publishes binaries, so an injection here is a supply-chain problem.
#   c-cpp    — restricted by .github/codeql-config.yml to `cbits/lvz_ts_shim.c|h`, the 132-line FFI
#              shim we wrote. The other ~430k lines under `cbits/ts-*/` are GENERATED tree-sitter
#              parsers, vendored verbatim; scanning them is slow and can only ever produce alerts
#              against code we do not own and would not patch.
#   rust     — dropped. The only .rs files are the synthetic budget fixtures under `tests/budget/`,
#              written to exercise the skeletoniser. Alerts on them would be pure noise.
#   js/ts    — dropped. The only .js files are tree-sitter's grammar DSL, vendored, not application
#              code.
#
# Actions are pinned to a full commit SHA per CLAUDE.md — a security workflow is the last place to
# trust a mutable tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # New queries ship continuously, so re-scan unchanged code on a schedule; push-only analysis goes
  # stale the moment the repo goes quiet.
  schedule:
    - cron: "27 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql-config.yml
          # `security-extended` is the point of an advanced setup — the default pack is a subset.
          # `security-and-quality` additionally adds maintainability rules; not enabled, because on a
          # vendored-C + workflows surface those would be noise rather than signal.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
