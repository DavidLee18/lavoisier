[package]
name = "lvz-gw-matrix"
version = "0.5.0"
description = "Matrix gateway for Lavoisier: a thin reqwest client-server API client (login + /sync long-poll + m.room.message send) that drives the shared agent, one room per session. End-to-end encryption (Olm/Megolm) is opt-in behind the `e2ee` feature."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lvz-protocol.workspace = true
lvz-schedule.workspace = true
lvz-tools.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

# Opt-in end-to-end encryption (Olm/Megolm) for encrypted rooms. Off by default — the default
# gateway stays a thin REST client with the minimal-dependency footprint. Enabling `e2ee` pulls in
# the crypto-only `matrix-sdk-crypto` (+ ruma/vodozemac) and requires Rust >= 1.93 (that crate's MSRV;
# the rest of the workspace still builds on the pinned 1.88 when the feature is off).
matrix-sdk-crypto = { version = "0.18", optional = true }
# Durable crypto store so the bot's E2EE identity (device keys, Olm/Megolm sessions, tracked
# devices) survives restarts. `bundled` compiles SQLite from source (no runtime libsqlite3),
# keeping the binary self-contained for minimal/distroless deployments.
matrix-sdk-sqlite = { version = "0.18", optional = true, default-features = false, features = ["crypto-store", "bundled"] }
ruma = { version = "0.16", optional = true, features = ["client-api", "events"] }
http = { version = "1", optional = true }

[features]
e2ee = ["dep:matrix-sdk-crypto", "dep:matrix-sdk-sqlite", "dep:ruma", "dep:http"]

[dev-dependencies]
serde_json.workspace = true

# Build docs.rs with `e2ee` on so the crypto module (off by default) is documented too. The
# feature needs Rust >= 1.93; docs.rs builds on recent nightly, so this resolves there.
[package.metadata.docs.rs]
features = ["e2ee"]
