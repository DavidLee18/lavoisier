[package]
name = "lvz-gw-tui"
version = "0.1.0"
description = "Inline terminal UI (TUI) frontend for Lavoisier: an interactive, scrollback-native REPL that drives the shared agent and renders its event stream — streaming text, tool-call cards, and Claude-Code-style tool-approval prompts."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lvz-protocol.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
unicode-width.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
