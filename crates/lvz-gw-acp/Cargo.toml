[package]
name = "lvz-gw-acp"
version = "0.2.0"
description = "Zed Agent Client Protocol (ACP) agent gateway for Lavoisier: drives the shared agent over JSON-RPC 2.0 on stdio so any ACP-capable editor (Zed, Neovim, …) can run it as a subprocess."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
lvz-protocol.workspace = true
async-trait.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
