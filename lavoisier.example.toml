# Example Lavoisier config. Copy to `lavoisier.toml` (auto-loaded from the working dir) or pass
# with `--config <PATH>`. Every key is optional. An explicit CLI flag or env var always wins over
# the file, which wins over the built-in default. Unknown keys are rejected (typos surface).

[provider]
# provider = "anthropic"        # xai | xai-responses | anthropic | google | claude-cli (default: xai)
#                               # An unknown name is a load error, not a silently ignored field.
# model    = "claude-..."       # default: the provider's default model
# Fallback chain (ordered, each `provider:model`): if the primary model is unresponsive or errors
# before streaming any output, the in-flight request is cancelled and the agent transparently
# reroutes to the next — so a slow/down provider doesn't hang the turn. Cross-provider; each named
# provider needs its API key in the env.
# fallback = ["anthropic:claude-sonnet-4-6", "google:gemini-3-flash-preview"]
# A failed model is demoted by a circuit breaker for this many seconds (default 60) before it's
# re-probed, so a persistently-down provider isn't re-tried every turn. `0` = re-probe every turn.
# fallback_cooldown = 60

# Provider-run (server-side) tools: the *provider* executes these and returns results inline, so
# they cost no tool-loop round-trip. None are on by default — they bill extra and each is
# provider-specific. `--server-tools web_search,code_execution` turns them on with their defaults
# and wins over this list wholesale; set them here when you need the filters.
#
# A tool the chosen provider does not support is REFUSED, not ignored: `x_search` is xAI-only, so
# asking for it on Anthropic fails the turn rather than quietly doing nothing. Available kinds:
# web_search | web_fetch | code_execution | x_search | collections_search | url_context.
#
# [[provider.server_tools]]
# kind = "web_search"
# max_uses = 5                       # cap searches per turn; omit for the provider default
# allowed_domains = ["docs.rs"]      # restrict results (mutually exclusive with blocked_domains)
# # blocked_domains = ["example.com"]
#
# [[provider.server_tools]]
# kind = "code_execution"
#
# [[provider.server_tools]]          # xAI only
# kind = "x_search"
# allowed_handles = ["AnthropicAI"]
# from_date = "2026-01-01"           # ISO-8601 YYYY-MM-DD window
# to_date = "2026-06-30"
#
# [[provider.server_tools]]          # xAI only; collection_ids is REQUIRED
# kind = "collections_search"
# collection_ids = ["col_123"]
# limit = 10
#
# [[provider.server_tools]]          # Gemini only
# kind = "url_context"

[agent]
# Context compaction / eviction
# compact_after = 60000         # compact history once it exceeds ~this many tokens
# context_limit = 120000        # soft per-request ceiling; evict oldest tool output to fit
# summary_model = "..."         # route compaction summaries to a cheaper model
# Routing / budget
# cheap_model    = "..."        # cheap-model-first
# escalate_after = 3            # escalate to the main model after N steps
# advisor_model  = "..."        # advisor+executor split
# budget         = 2000000      # total-task cost-weighted token ceiling
# max_steps      = 12
# max_tokens     = 4096
# repo_skeleton  = 4000         # cache-aware repo-skeleton prefix budget (tokens)
# thinking       = "high"       # Gemini thinking effort: low|high|dynamic|N
# Persona + accuracy levers (off by default)
# persona        = "PERSONA.md"
# require_edit   = true
# verify_and_fix = true
# verify_cmd     = "cargo test --quiet"

[memory]
# Bounds for the in-memory session store (unbounded by default):
# max_messages = 200            # keep each session's most recent N messages
# max_sessions = 100            # keep at most N sessions (LRU eviction)
# Durable, file-backed store (survives restarts) instead of process-only memory:
# store = "file"                # "memory" (default) | "file"
# path  = "./.lavoisier/sessions"   # required when store = "file"

[gateway]
# serve            = "127.0.0.1:8080"
# serve_matrix     = true
# serve_slack      = true        # Slack Socket Mode (needs SLACK_APP_TOKEN + SLACK_BOT_TOKEN)
# serve_a2a        = "127.0.0.1:8081"   # A2A (Agent-to-Agent) server: Agent Card + JSON-RPC/SSE
# acp              = true        # Zed Agent Client Protocol agent over stdio (for editors; run `lav --acp`)
# tui              = true        # Interactive inline terminal UI (scrollback-native REPL; run `lav --tui`)
# tui_auto_approve = false       # Skip TUI tool-approval prompts (default: reads auto, mutations ask)
# api_keys         = ["key1", "key2"]   # also gate the A2A endpoint
# rate_limit       = 60          # requests per 60s window
# Cron gateway (--cron / --cron-file): retry a failed fire (rejected submit or mid-turn stream error)
# cron_retry_max   = 2           # global default max retries (0 = no retry); --cron-file job overrides
# cron_retry_wait  = 60          # seconds between retries (fixed). env LVZ_CRON_RETRY_MAX/_WAIT win
# Matrix schedules (--schedule-file): jobs run *inside* the Matrix gateway and report to a room.
# A job is either a direct tool call (runs unconditionally, no model round-trip) or a prompt turn:
#   [{"id":"disk","schedule":"0 9 * * *","room":"!ops:hs","tool":"shell",
#     "args":{"command":"df -h"},"retry_max":2,"retry_wait":60},
#    {"id":"build","schedule":"*/15 * * * *","prompt":"check the build"}]
# A tool job may add "summarize":"<instruction>" to post prose instead of the tool's raw output: the
# tool still runs deterministically, then a *tool-less* turn (empty allowlist — it can only write
# text) rewrites the result under the instruction. BOTH outcomes are summarised — the prose is
# prefixed SUCCESS/FAILURE so the model renders a failure in the register of a failure — and the ❌
# marker plus the `retry n/m` countdown stay structural, outside the prose slot, so a paraphrase can
# never hide or soften a genuinely refused call. A provider outage degrades to the raw output. Set the
# job's "session" to the report room id so a reply to the summary has the room's conversation context.
#   [{"id":"wake","schedule":"25 10 * * 2,3,4","room":"!ops:hs","session":"!ops:hs",
#     "tool":"server_wake","args":{},"summarize":"Say what happened in one plain sentence."}]
# schedule_file       = "./jobs.json"          # requires serve_matrix
# schedule_room       = "!ops:example.org"     # default report room (falls back to matrix_home_room)
# schedule_retry_max  = 2        # global default max retries (0 = no retry); a job overrides it
# schedule_retry_wait = 60       # seconds between retries. env LVZ_SCHEDULE_RETRY_MAX/_WAIT win
# A tool that ACCEPTS long-running work rather than finishing it (waking a machine, a remote build)
# may return a PENDING result naming a poll tool and a handle. The scheduler then does NOT report
# success — it polls until a terminal Ok/Err and reports THAT, so `job fired ok` means *completed*,
# never merely *dispatched*. The room stays silent until the outcome is real: a provisional success
# later contradicted is worse than silence, because the first message is the one people act on.
# While work is in flight the cron slot and any retry are suppressed, so the next tick cannot
# double-dispatch it, and a terminal failure retries exactly like any other failure. Polling is a
# flat 30s cadence; the deadline below bounds the total, not the interval.
# schedule_pending_timeout = 600 # fallback polling budget (s) for a tool that gives no
#                                # `estimated_seconds`; the deadline is 2x this, after which the job
#                                # is reported as a TIMEOUT rather than holding its slot forever.
#                                # A tool's own estimate wins. env LVZ_SCHEDULE_PENDING_TIMEOUT wins.
# Matrix gateway:
# matrix_auto_join    = true     # auto-accept Matrix room invites (default true)
# matrix_state_dir    = "./.lavoisier/matrix"  # persist session (token + device id) + E2EE crypto
#                                              # store here so identity is stable across restarts
#                                              # (env MATRIX_STATE_DIR wins). Auth via env:
#                                              # MATRIX_ACCESS_TOKEN or MATRIX_USER+MATRIX_PASSWORD.
#   LAYOUT: `session.json` sits directly in this dir; the SQLite crypto store is ONE LEVEL DOWN at
#   `<matrix_state_dir>/crypto`. Anything opening the store directly (a migration tool, a backup, a
#   manual `sqlite3`) needs the subdirectory — and getting it wrong is NOT an error: the store is
#   CREATED when absent, so pointing at the state dir yields an empty store and, with an injected
#   MATRIX_ACCESS_TOKEN, a fresh Olm account published under the EXISTING device id. Homeservers
#   refuse that, and the bot ends up undecryptable in both directions.
# matrix_require_e2ee = true     # refuse to start if E2EE cannot be initialised, instead of
#                                # degrading to plaintext. OFF by default, which suits a gateway
#                                # serving a mix of plaintext and encrypted rooms; set it when every
#                                # room is encrypted, or a bad MATRIX_CRYPTO_STORE_KEY / a store at
#                                # the wrong path leaves the bot up, healthy-looking, and unable to
#                                # read or write a single message. --require-e2ee / LVZ_REQUIRE_E2EE win.
# matrix_allowed_users = ["@alice:hs", "@bob:hs"]   # only answer these senders (env
#                                                   # MATRIX_ALLOWED_USERS wins; empty = everyone)
# matrix_allowed_rooms = ["!ops:hs", "!general:hs"] # only act in these rooms (env
#                                                   # MATRIX_ALLOWED_ROOMS wins; empty = any room).
#                                                   # Combined with matrix_allowed_users as AND:
#                                                   # an allowed user must also be in an allowed room.
# matrix_home_room    = "!ops:hs"                   # receives the "shutting down" notice on
#                                                   # SIGTERM/Ctrl-C (env MATRIX_HOME_ROOM wins)
# matrix_media_dir    = "./.lavoisier/media"        # ENABLES media ingest: an engaged image/file
#                                                   # message is downloaded here and its local path
#                                                   # handed to the agent so a tool can act on it
#                                                   # (env MATRIX_MEDIA_DIR / --matrix-media-dir win;
#                                                   # unset = media messages ignored)
# Per-room / per-member tool permissions (config-file only). A room/user absent from a map is
# unconstrained; when both a room and a member policy apply, the effective set is their INTERSECTION
# (a tool must be permitted by the room AND the member). Pair with matrix_allowed_rooms/_users for a
# deny-by-default perimeter.
# [gateway.matrix_room_tools]
# "!ops:hs"     = ["shell", "read_file", "write_file", "str_replace"]
# "!general:hs" = ["read_file", "read_files", "outline_file"]   # read-only room
# [gateway.matrix_user_tools]
# "@alice:hs" = ["shell", "read_file", "write_file", "str_replace"]
# "@bob:hs"   = ["read_file", "read_files"]                     # bob: reads only
# Slack gateway:
# slack_allowed_users  = ["U_ALICE", "U_BOB"]       # only answer these Slack users (env
#                                                   # SLACK_ALLOWED_USERS wins; empty = everyone)

# ---------------------------------------------------------------------------------------------
# [legion] — a multi-model council that argues the task out before the agent acts.
#
# Two or more debaters (each `provider:model`) draft a position, critique each other (`rounds`,
# default 1), and a judge synthesises one agreed plan that seeds the executor (deliberate-then-act).
# Cross-provider is first-class; each named provider needs its API key in the env. Supersedes
# `[agent] advisor_model`. The debate is internal — watch it with `--log-level 'lvz_legion=debug'`.
# `--legion-debater` / `--legion-judge` / `--legion-rounds` (env LVZ_LEGION_ROUNDS) take precedence.
# ---------------------------------------------------------------------------------------------
# [legion]
# debaters = ["anthropic:claude-opus-4-8", "xai:grok-4"]   # two or more required to convene
# judge    = "anthropic:claude-opus-4-8"                   # default: the first debater
# rounds   = 1                                             # critique rounds after the draft (0 = none)

# ---------------------------------------------------------------------------------------------
# [mcp] — external Model Context Protocol servers whose tools Lavoisier connects to and exposes.
#
# Lavoisier is the MCP *client*: each server's tools are discovered at startup and adapted into the
# tool set the agent uses, so every frontend (CLI, HTTP/Matrix/Slack/cron gateways) gains them. Each
# spec is `label: target` — a command to spawn (stdio transport) or an `http(s)://` URL. Tools are
# namespaced `<label>_<tool>` so they never shadow the built-ins. `--mcp-server` (repeatable) wins.
# ---------------------------------------------------------------------------------------------
# [mcp]
# servers = [
#   "fs: npx -y @modelcontextprotocol/server-filesystem .",   # stdio: spawned child process
#   "remote: https://mcp.example.com/rpc",                     # HTTP: Streamable-HTTP endpoint
# ]

# ---------------------------------------------------------------------------------------------
# [log] — structured logging to stderr (tracing).
#
# Operator diagnostics (gateways, scheduler, memory) are tracing events. The DEFAULT filter is our
# own crates at `info` and everything else at `warn`, so that output prints as it always has while
# dependency chatter stays hidden — `tracing` is a facade shared with tonic/hyper/h2/axum, so an
# unscoped `info` would surface their events too.
#
# Set `level` to retune: quieter (`warn`), louder (`debug`), or targeted at one subsystem. The value
# is a RUST_LOG-style filter. `--log-level` / `LVZ_LOG_LEVEL` take precedence over this file. A
# malformed filter is reported and the default is used, so a typo can't silence a daemon.
#
# The CLI's own [tool]/[usage]/[done] rendering and the --telemetry line are NOT logging and are
# never suppressed by this setting.
# ---------------------------------------------------------------------------------------------
# [log]
# level = "info"                                    # everything at info and above
# level = "debug"                                   # noisier, includes dependency chatter
# level = "lvz_gw_matrix=debug,warn"                # Matrix gateway at debug, everything else warn
# level = "lavoisier=info,lvz_schedule=debug,error" # per-crate targeting
